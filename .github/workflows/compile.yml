name: Build GMpro Firmware

on:
  workflow_dispatch: # Supaya lu bisa klik tombol "Run" manual

jobs:
  build:
    runs-with: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP8266 Core
        run: |
          arduino-cli core update-index --additional-urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls http://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Compile GMpro
        run: |
          # Kita compile file .ino yang lu punya di root
          arduino-cli compile --fqbn esp8266:esp8266:d1_mini --output-dir ./output ./esp8266_deauther.ino

      - name: Upload Binary (.bin)
        uses: actions/upload-artifact@v3
        with:
          name: GMpro2_Firmware
          path: ./output/*.bin
